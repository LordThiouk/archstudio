name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first: nothing here needs the
# history of every intermediate commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.13 is the documented floor and the reason this matrix exists:
        # `node:sqlite` is flagged before it, so anything older dies on the
        # first import. Testing it here keeps README and reality in step.
        node: ['22.13', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # Advisory, not a gate. `sharp` carries known high-severity libvips
      # advisories through Next 15, and the only fix is a major Next upgrade —
      # see SECURITY.md. Breaking the build on that would train everyone to
      # ignore a red X, so this reports and only fails on `critical`.
      - name: Audit (fails on critical only)
        run: npm audit --audit-level=critical

      - name: Full report
        if: always()
        run: npm audit || true
